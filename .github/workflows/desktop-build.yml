name: Build portable desktop downloads

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            architecture: x64
          - os: macos-15
            platform: macos
            architecture: arm64
          - os: macos-15-intel
            platform: macos
            architecture: x64
          - os: ubuntu-22.04
            platform: linux
            architecture: x64
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.2.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build desktop app
        run: python scripts/build_desktop.py --version "$APP_VERSION"
        shell: bash
      - name: Package portable download
        run: python scripts/package_portable.py --platform "${{ matrix.platform }}" --architecture "${{ matrix.architecture }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: EPUB-Audiobook-Maker-${{ matrix.platform }}-${{ matrix.architecture }}
          path: artifacts/EPUB-Audiobook-Maker-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: EPUB-Audiobook-Maker-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
