name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            architecture: x64
          - os: macos-15
            platform: macos
            architecture: arm64
          - os: macos-15-intel
            platform: macos
            architecture: x64
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build desktop app
        run: python scripts/build_desktop.py --version "$APP_VERSION"
        shell: bash
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" "/Oartifacts" "packaging/windows.iss"
      - name: Build macOS disk image
        if: matrix.platform == 'macos'
        run: scripts/package_macos.sh
        shell: bash
        env:
          MAC_ARCH: ${{ matrix.architecture }}
      - uses: actions/upload-artifact@v4
        with:
          name: EPUB-Audiobook-Maker-${{ matrix.platform }}-${{ matrix.architecture }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: EPUB-Audiobook-Maker-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
